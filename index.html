    <title>Gym Log</title>
    <script>
      // Light mode needs dark status-bar text; iOS only reads this tag when the app launches.
      try {
        var look = JSON.parse(localStorage.getItem('gymlog-look') || '{}');
        if (look.light) document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
        if (look.bg) document.documentElement.style.background = look.bg;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
